<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AOTrino — Shell Commander</title>
    <!-- xterm.js, embedded in the app's WebRoot and loaded locally, so the console has no external dependency. -->
    <link rel="stylesheet" href="xterm.css" />
    <!-- restore the pinned theme before the body renders, so a remembered light/dark choice does not flash. -->
    <script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { }</script>
    <style>
        /*
            Retro orthodox file manager look. The palette follows the Windows app theme through
            prefers-color-scheme, and the caption's theme button overrides it with data-theme on the root,
            which is why the light and dark values appear both under the media query and under data-theme.
        */
        :root, :root[data-theme="light"] {
            --bg: #efeadb;
            --panel: #faf6ea;
            --panel-head: #e4dcc6;
            --border: #b39b6a;
            --text: #2a2620;
            --dim: #6b6250;
            --folder: #8a5a00;
            --sel-bg: #1a56c4;
            --sel-text: #ffffff;
            --bar: #e4dcc6;
            --accent: #1a56c4;
            --close: #c42b1c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a1b3d;
                --panel: #0e2450;
                --panel-head: #143063;
                --border: #4f7bd0;
                --text: #d6e4ff;
                --dim: #8fa9d8;
                --folder: #ffd23f;
                --sel-bg: #2a6ff0;
                --sel-text: #ffffff;
                --bar: #071531;
                --accent: #66d9ff;
                --close: #e04a3a;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0a1b3d;
            --panel: #0e2450;
            --panel-head: #143063;
            --border: #4f7bd0;
            --text: #d6e4ff;
            --dim: #8fa9d8;
            --folder: #ffd23f;
            --sel-bg: #2a6ff0;
            --sel-text: #ffffff;
            --bar: #071531;
            --accent: #66d9ff;
            --close: #e04a3a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Cascadia Mono", "Consolas", ui-monospace, monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        /*
            The window has no native title bar, so the page draws it. data-aotrino-drag hands the strip to Windows
            for moving and double-click maximize, data-aotrino-nodrag keeps the buttons clickable.
        */
        .caption {
            display: flex;
            align-items: center;
            height: 30px;
            background: var(--bar);
            border-bottom: 1px solid var(--border);
        }

            .caption .title {
                padding: 0 10px;
                color: var(--accent);
                font-weight: bold;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .caption .capspace {
                flex: 1;
            }

        .capbtn {
            width: 40px;
            height: 30px;
            border: 0;
            border-left: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

            .capbtn:hover {
                background: var(--panel-head);
            }

            .capbtn.close:hover {
                background: var(--close);
                color: #fff;
            }

        /* the path bar, the current folder and the way back up */
        .pathbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: var(--bar);
            border-bottom: 1px solid var(--border);
        }

        .path {
            flex: 1;
            min-width: 0;
            font: inherit;
            color: var(--accent);
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 3px 8px;
            outline: none;
        }

            .path:focus {
                border-color: var(--accent);
                color: var(--text);
            }

        button {
            font: inherit;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 3px 10px;
            cursor: pointer;
        }

            button:hover:not(:disabled) {
                background: var(--panel-head);
            }

            button:disabled {
                opacity: 0.4;
                cursor: default;
            }

        /* a compact icon only button (the Reveal in Explorer glyph in the path bar). */
        .iconbtn {
            padding: 3px 9px;
            font-size: 15px;
            line-height: 1;
        }

        /* two framed panels side by side, the commander's whole shape */
        .panels {
            flex: 1;
            display: flex;
            gap: 6px;
            padding: 6px;
            min-height: 0;
        }

        /* the draggable divider between the two panels, moved by the mouse to give either side more room. */
        .splitter {
            flex: 0 0 6px;
            cursor: col-resize;
            background: var(--border);
            border-radius: 3px;
        }

            .splitter:hover, .splitter.dragging {
                background: var(--accent);
            }

        #navPanel {
            flex: 0 0 46%;
        }

        .panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--border);
        }

            .panel > .head {
                padding: 3px 8px;
                background: var(--panel-head);
                border-bottom: 1px solid var(--border);
                color: var(--dim);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

        .list {
            flex: 1;
            overflow: auto;
            outline: none;
        }

        /* a spacer as tall as every row would be, so the scrollbar spans the whole folder while only the visible rows exist. */
        .list-sizer {
            position: relative;
            width: 100%;
        }

        .colhead {
            display: grid;
            grid-template-columns: 1fr 6rem 9.5rem;
            gap: 8px;
            padding: 3px 8px;
            color: var(--dim);
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }

            .colhead span:not(:first-child) {
                text-align: right;
            }

            .colhead span {
                cursor: pointer;
                user-select: none;
            }

                .colhead span:hover {
                    color: var(--accent);
                }

        /* rows are absolutely positioned inside the sizer at index * ROW_H, and a fixed height so that math holds. */
        .row {
            position: absolute;
            left: 0;
            right: 0;
            height: 22px;
            display: grid;
            grid-template-columns: 1fr 6rem 9.5rem;
            align-items: center;
            gap: 8px;
            padding: 2px 8px;
            cursor: pointer;
            white-space: nowrap;
        }

            .row .name-cell {
                display: flex;
                align-items: center;
                gap: 6px;
                overflow: hidden;
            }

            .row .glyph {
                flex: 0 0 16px;
                width: 16px;
                height: 16px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                line-height: 1;
            }

                .row .glyph img {
                    width: 16px;
                    height: 16px;
                    display: block;
                }

            .row.dir .name {
                color: var(--folder);
            }

            .row .name {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .row .size, .row .mod {
                color: var(--dim);
                font-size: 12px;
                text-align: right;
            }

            .row:hover {
                background: color-mix(in srgb, var(--sel-bg) 20%, transparent);
            }

            .row.sel {
                background: var(--sel-bg);
                color: var(--sel-text);
            }

                .row.sel .name, .row.sel .size, .row.sel .mod {
                    color: var(--sel-text);
                }

        /* gallery: an absolutely positioned cell, a centered thumbnail box over a clipped name. */
        .cell {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
            cursor: pointer;
            overflow: hidden;
        }

            .cell .thumb {
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px;
                line-height: 1;
            }

                .cell .thumb img {
                    max-width: 100%;
                    max-height: 100%;
                    display: block;
                }

            .cell .cell-name {
                max-width: 100%;
                text-align: center;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 12px;
            }

            .cell.dir .cell-name {
                color: var(--folder);
            }

            .cell:hover {
                background: color-mix(in srgb, var(--sel-bg) 20%, transparent);
            }

            .cell.sel {
                background: var(--sel-bg);
            }

                .cell.sel .cell-name {
                    color: var(--sel-text);
                }

        /* the thumbnail size slider in the function bar, shown only in the gallery. */
        .thumbctl {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 0 6px;
        }

            .thumbctl input[type="range"] {
                width: 90px;
                accent-color: var(--accent);
                cursor: pointer;
            }

        .preview {
            flex: 1;
            position: relative;
            min-height: 0;
            overflow: auto;
            background: #fff;
        }

            .preview iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
                display: none;
                background: #fff;
            }

            .preview img {
                display: none;
            }

                .preview img.show {
                    display: block;
                }

            /* fit scales the image down to the pane and centers it, actual shows it full size and the pane scrolls */
            .preview.fit {
                overflow: hidden;
            }

                .preview.fit img.show {
                    position: absolute;
                    inset: 0;
                    margin: auto;
                    max-width: 100%;
                    max-height: 100%;
                }

            .preview .ph {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                text-align: center;
                white-space: pre-line;
                color: var(--dim);
            }

            /* the details card, shown for folders, un-previewable files, or on demand (F4). */
            .preview .details {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                overflow: auto;
                padding: 20px 18px;
                color: var(--text);
                background: var(--panel);
            }

                .preview .details .d-icon {
                    width: 96px;
                    height: 96px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 64px;
                    line-height: 1;
                }

                    .preview .details .d-icon img {
                        max-width: 96px;
                        max-height: 96px;
                    }

                .preview .details .d-name {
                    margin-top: 10px;
                    font-weight: bold;
                    text-align: center;
                    word-break: break-word;
                }

                .preview .details .d-type {
                    color: var(--dim);
                    font-size: 12px;
                    margin-bottom: 12px;
                }

                .preview .details .d-table {
                    width: 100%;
                    max-width: 460px;
                    border-collapse: collapse;
                    font-size: 12px;
                }

                    .preview .details .d-table td {
                        padding: 3px 6px;
                        vertical-align: top;
                        border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
                    }

                    .preview .details .d-table .dcat td {
                        color: var(--accent);
                        font-weight: bold;
                        padding-top: 10px;
                        border-bottom: 1px solid var(--border);
                    }

                    .preview .details .d-table .dk {
                        color: var(--dim);
                        white-space: nowrap;
                        width: 8.5rem;
                    }

                    .preview .details .d-table .dv {
                        word-break: break-word;
                        user-select: text;
                    }

                .preview .details .d-actions {
                    margin-top: 14px;
                }

        /* the Details button reads pressed while that mode is on. */
        .fnbar #details.active {
            background: var(--sel-bg);
            color: var(--sel-text);
            border-color: var(--sel-bg);
        }

            .fnbar #details.active .key {
                color: var(--sel-text);
            }

        .error {
            margin: 0;
            padding: 4px 8px;
            background: #5a1f1f;
            color: #ffd0cc;
            border-bottom: 1px solid #7a2a2a;
        }

        /* the function-key bar along the bottom, the genre's signature */
        .fnbar {
            display: flex;
            gap: 6px;
            padding: 5px 8px;
            background: var(--bar);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

            .fnbar button {
                padding: 3px 12px;
            }

            .fnbar .key {
                color: var(--accent);
                font-weight: bold;
            }

            .fnbar .spacer {
                flex: 1;
            }

        /* the draggable divider above the console, resizing its height. shown only while the console is open. */
        .hsplitter {
            display: none;
            height: 6px;
            cursor: row-resize;
            background: var(--border);
        }

            .hsplitter.open {
                display: block;
            }

            .hsplitter:hover, .hsplitter.dragging {
                background: var(--accent);
            }

        /* auto-disappearing toasts, stacked above the function bar, announcing shell changes to the current folder. */
        .toasts {
            position: fixed;
            right: 12px;
            bottom: 44px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

            .toasts .toast {
                max-width: 40ch;
                padding: 6px 12px;
                background: var(--panel-head);
                border: 1px solid var(--border);
                border-radius: 4px;
                color: var(--text);
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
                opacity: 0;
                transform: translateY(6px);
                transition: opacity .25s, transform .25s;
            }

                .toasts .toast.show {
                    opacity: 1;
                    transform: none;
                }

        /* the collapsible console drawer, hidden until opened with F8, xterm.js draws inside its body. */
        .console {
            display: none;
            flex-direction: column;
            height: 260px;
            min-height: 0;
            background: #000;
            border-top: 1px solid var(--border);
        }

            .console.open {
                display: flex;
            }

            .console .console-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 2px 8px;
                background: var(--panel-head);
                border-bottom: 1px solid var(--border);
                color: var(--dim);
                font-size: 12px;
            }

            .console .console-title {
                color: var(--accent);
                font-weight: bold;
            }

            .console .console-shell {
                font: inherit;
                font-size: 12px;
                color: var(--text);
                background: var(--panel);
                border: 1px solid var(--border);
                padding: 1px 4px;
                cursor: pointer;
            }

            .console .console-sync {
                display: flex;
                align-items: center;
                gap: 3px;
                cursor: pointer;
            }

            .console .console-cwd {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .console .spacer {
                flex: 1;
            }

            .console .console-x {
                padding: 0 8px;
                border: 0;
                background: transparent;
                color: var(--text);
                cursor: pointer;
            }

                .console .console-x:hover {
                    background: var(--close);
                    color: #fff;
                }

            .console .console-body {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                padding: 2px 4px;
            }
    </style>
</head>
<body>
    <header class="caption" data-aotrino-drag>
        <span class="title"></span>
        <span class="capspace"></span>
        <div data-aotrino-nodrag style="display:flex">
            <button class="capbtn" id="theme" data-t-title="Caption_Theme">&#x263E;</button>
            <button class="capbtn" id="min" data-t-title="Caption_Minimize">&#x2013;</button>
            <button class="capbtn" id="max" data-t-title="Caption_Maximize">&#x25A2;</button>
            <button class="capbtn close" id="closeWin" data-t-title="Caption_Close">&#x2715;</button>
        </div>
    </header>

    <div class="pathbar">
        <button id="up" data-t="Up_Label" data-t-title="Up_Tip"></button>
        <button id="reveal" class="iconbtn" data-t-title="Reveal_Tip">🪟</button>
        <input class="path" id="path" spellcheck="false" data-t-title="Path_Tip" />
    </div>
    <p class="error" id="error" style="display:none"></p>

    <div class="panels" id="panels">
        <section class="panel" id="navPanel">
            <div class="head" id="navhead" data-t="Head_Navigation"></div>
            <div class="colhead">
                <span data-col="name" data-t="Col_Name"></span>
                <span data-col="size" data-t="Col_Size"></span>
                <span data-col="mod" data-t="Col_Modified"></span>
            </div>
            <div class="list" id="list" tabindex="0"><div class="list-sizer" id="listSizer"></div></div>
        </section>
        <div class="splitter" id="splitter" data-t-title="Splitter_Panels_Tip"></div>
        <section class="panel">
            <div class="head" data-t="Head_Preview"></div>
            <div class="preview" id="preview">
                <img id="previewImg" alt="" />
                <iframe id="previewFrame" data-t-title="Head_Preview"></iframe>
                <div class="details" id="previewDetails"></div>
                <div class="ph" id="previewPh" data-t="Preview_SelectFile"></div>
            </div>
        </section>
    </div>

    <div class="hsplitter" id="consoleSplitter" data-t-title="Splitter_Console_Tip"></div>
    <div class="console" id="consolePane">
        <div class="console-head">
            <span class="console-title" data-t="Console_Title"></span>
            <select class="console-shell" id="consoleShell" data-t-title="Console_Shell_Tip"></select>
            <label class="console-sync" data-t-title="Console_Sync_Tip"><input type="checkbox" id="consoleSync" /> <span data-t="Console_Sync_Label"></span></label>
            <span class="console-cwd" id="consoleCwd"></span>
            <span class="spacer"></span>
            <button class="console-x" id="consoleClose" data-t-title="Console_Close_Tip">&#x2715;</button>
        </div>
        <div class="console-body" id="consoleBody"></div>
    </div>

    <div class="toasts" id="toasts"></div>

    <div class="fnbar">
        <button id="desktop" data-t-title="Fn_Desktop_Tip"><span class="key">F1</span> <span data-t="Fn_Desktop"></span></button>
        <button id="thispc" data-t-title="Fn_ThisPc_Tip"><span class="key">F2</span> <span data-t="Fn_ThisPc"></span></button>
        <button id="refresh" data-t-title="Fn_Refresh_Tip"><span class="key">F5</span> <span data-t="Fn_Refresh"></span></button>
        <button id="details" data-t-title="Fn_Details_Tip"><span class="key">F4</span> <span data-t="Fn_Details"></span></button>
        <button id="view" data-t-title="Fn_View_Tip"><span class="key">F3</span> <span id="viewlabel"></span></button>
        <label id="thumbctl" class="thumbctl" data-t-title="Fn_ThumbSize_Tip"><span class="key">◱</span><input type="range" id="thumbSlider" min="64" max="256" step="32" /></label>
        <button id="iconmode" data-t-title="Fn_IconMode_Tip"><span class="key">F6</span> <span id="iconmodelabel"></span></button>
        <button id="fit" data-t-title="Fn_Fit_Tip"><span class="key">F7</span> <span id="fitlabel"></span></button>
        <button id="console" data-t-title="Fn_Console_Tip"><span class="key">CTRL+O</span> <span data-t="Fn_Console"></span></button>
        <span class="spacer"></span>
        <button id="quit" data-t-title="Fn_Quit_Tip"><span class="key">F10</span> <span data-t="Fn_Quit"></span></button>
    </div>

    <!-- xterm.js and its fit addon, UMD builds that expose the Terminal and FitAddon globals the console uses. -->
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script>
        const shell = () => chrome.webview.hostObjects.sync.shell;
        const aot = () => window.__aotrino;
        const listEl = document.getElementById("list");
        const listSizer = document.getElementById("listSizer");
        const thumbEl = document.getElementById("thumbSlider");
        const pathEl = document.getElementById("path");
        const errEl = document.getElementById("error");
        const upBtn = document.getElementById("up");
        const previewEl = document.getElementById("preview");
        const previewImg = document.getElementById("previewImg");
        const previewFrame = document.getElementById("previewFrame");
        const previewDetails = document.getElementById("previewDetails");
        const previewPh = document.getElementById("previewPh");
        const MARKDOWN = /\.(md|markdown|mdown|mkdn?)$/i;

        // localization: the whole catalog crosses the bridge once (see AOTrino.Localization), then t(key) is a local lookup, so no user text lives here.
        // an unknown key renders as itself, which surfaces a missing string plainly.
        let catalog = {};
        function t(key) { const v = catalog[key]; return v == null ? key : v; }

        // apply the catalog to the static markup: text for [data-t], the tooltip for [data-t-title].
        // the JS driven labels (view, fit, icon mode, the folder header) are refreshed by loadCatalog after this.
        function applyTranslations() {
            for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.getAttribute("data-t"));
            for (const el of document.querySelectorAll("[data-t-title]")) el.title = t(el.getAttribute("data-t-title"));
        }

        async function loadCatalog() {
            try { catalog = JSON.parse(await chrome.webview.hostObjects.localization.GetCatalog()); }
            catch (e) { catalog = {}; }

            applyTranslations();
            applyFit();
            applyView();
            document.getElementById("iconmodelabel").textContent = iconMode ? t("Icon_Icons") : t("Icon_Thumbnails");
            if (current) updateCount();
        }

        let fitPreview = true;      // fit the preview image to the pane by default
        let previewEntry = null;    // what the preview is showing, so it can re-render when the theme changes
        let detailsMode = localStorage.getItem("preview.details") === "1";   // F4: show the details card instead of the preview

        // encode each path segment so #, ?, %, spaces and unicode are all safe.
        // encodeURI is not enough here: it leaves # and ? alone, so a path like "F:\images\paths#é #!" would break at the first # (the rest read as a fragment).
        // the drive segment keeps its colon.
        function fileUrl(p) {
            return "file:///" + p.replace(/\\/g, "/").split("/")
                .map((seg, i) => (i === 0 && /^[A-Za-z]:$/.test(seg)) ? seg : encodeURIComponent(seg))
                .join("/");
        }

        function isCurrent(forId) { return current && selIndex >= 0 && (current.Entries[selIndex] || {}).Id === forId; }

        let previewIsMarkdown = false;   // the frame is showing rendered markdown, so its links and Back apply
        let mdStack = [];                // the markdown items visited, so Back can return to the previous one
        let mdSeq = 0;                   // guards a stale markdown render when the selection or the stack moved on
        let mdVersion = 0;               // cache-busts the reloaded temp file so the frame actually refreshes

        function fileUrlToPath(u) {
            if (!/^file:/i.test(u)) return null;

            return decodeURIComponent(u.replace(/^file:\/*/i, "")).replace(/\//g, "\\");
        }

        // clicks and Back inside the rendered markdown.
        // it is a file:// document, same origin as this page, so we can reach into it:
        // an external link opens in the system browser, a link to another markdown renders in place (with a Back stack),
        // any other relative link opens in its default app, and Backspace / Alt + Left go back.
        previewFrame.addEventListener("load", () => {
            let doc;
            try { doc = previewFrame.contentDocument; } catch (x) { return; }   // a document we are not allowed into
            if (!doc) return;

            doc.addEventListener("click", (ev) => {
                const a = ev.target && ev.target.closest && ev.target.closest("a[href]");
                if (!a) return;
                if (/^https?:/i.test(a.href)) {
                    ev.preventDefault();
                    chrome.webview.hostObjects.shell.OpenExternal(a.href);
                    return;
                }

                if (!previewIsMarkdown) return;

                const path = fileUrlToPath(a.href);
                if (!path) return;

                ev.preventDefault();
                if (MARKDOWN.test(path)) {
                    mdStack.push({ id: path, name: path });
                    renderMarkdownTop();
                } else {

                    ev.preventDefault();
                    markdownBack();
                }
            });
        });

        function clearPreview(message) {
            previewIsMarkdown = false;
            previewImg.classList.remove("show");
            previewImg.removeAttribute("src");
            previewFrame.style.display = "none";
            previewFrame.removeAttribute("src");
            previewFrame.removeAttribute("srcdoc");
            previewDetails.style.display = "none";
            previewDetails.innerHTML = "";
            previewPh.textContent = message;
            previewPh.style.display = "flex";

        // the host decides everything: an image the WebView shows, a document it renders in a frame (pdf, media, text), or an image only WIC can read, decoded to a png.
        // we just show whatever Kind comes back. markdown is special, rendered to html by the host and shown in a themed frame with a Back stack.
        // a folder, an un-previewable file, or details mode (F4) shows the details card instead.
        function showPreview(e) {
            previewEntry = e;
            mdSeq++;   // a new preview supersedes any markdown render still resolving
            if (!e) { clearPreview(t("Preview_SelectFile")); return; }
            if (detailsMode || e.IsFolder) { showDetails(e); return; }
            if (MARKDOWN.test(e.Name)) { showMarkdown(e); return; }

            clearPreview(t("Preview_Loading"));
            const forId = e.Id;
            chrome.webview.hostObjects.shell.GetPreview(e.Id).then((json) => {
                if (!isCurrent(forId)) return;   // the selection moved on while this was resolving

                const r = JSON.parse(json);
                if (!r.Path) { showDetails(e); return; }   // no preview for this type: fall back to the details card

                if (r.Kind === "image") {
                    previewFrame.style.display = "none";
                    previewFrame.removeAttribute("src");
                    previewPh.style.display = "none";
                    previewImg.src = fileUrl(r.Path);
                    previewImg.classList.add("show");
                } else {
                    previewImg.classList.remove("show");
                    previewFrame.removeAttribute("srcdoc");
                    previewFrame.src = fileUrl(r.Path);
                    previewFrame.style.display = "block";
                    previewPh.style.display = "none";
                }

        }

        // the details card: the item's icon, name, shell type, the property store values Windows reports, and Open.
        function showDetails(e) {
            const forId = e.Id;
            clearPreview(t("Preview_Loading"));
            chrome.webview.hostObjects.shell.GetDetails(e.Id).then((json) => {
                if (!isCurrent(forId)) return;
                const d = JSON.parse(json);
                if (d.Error) { clearPreview(d.Error); return; }
                renderDetailsCard(e, d);
            }).catch((x) => clearPreview(String(x)));

        // fill the details card's table with label/value rows (the curated set, or every property when expanded).
        // rows carrying a Category (the all-properties view) get a category header row when the category changes.
        function fillDetailsTable(rows) {
            const tbody = previewDetails.querySelector(".d-table tbody");
            tbody.innerHTML = "";
            let lastCategory;
            (rows || []).forEach((r) => {
                if (r.Category && r.Category !== lastCategory) {
                    lastCategory = r.Category;
                    const head = document.createElement("tr");
                    head.className = "dcat";
                    head.innerHTML = `<td colspan="2"></td>`;
                    head.querySelector("td").textContent = r.Category;
                    tbody.appendChild(head);
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `<td class="dk"></td><td class="dv"></td>`;
                tr.querySelector(".dk").textContent = r.Label;
                tr.querySelector(".dv").textContent = r.Value;
                tbody.appendChild(tr);
            });
        }

        function renderDetailsCard(e, d) {
            previewDetails.innerHTML =
                `<div class="d-icon"><span class="glyph">${e.IsFolder ? "📁" : "📄"}</span></div>` +
                `<div class="d-name"></div>` +
                `<div class="d-type"></div>` +
                `<table class="d-table"><tbody></tbody></table>` +
                `<div class="d-actions"><button class="d-open"></button></div>`;
            previewDetails.querySelector(".d-name").textContent = d.Name || e.Name;
            previewDetails.querySelector(".d-type").textContent = d.TypeName || "";
            fillDetailsTable(d.Rows);
            if (e.Id) loadIcon(previewDetails.querySelector(".d-icon .glyph"), e.Id, e.Modified || "", 96);

            const openBtn = previewDetails.querySelector(".d-open");
            openBtn.textContent = t("Details_Open");
            openBtn.addEventListener("click", () => chrome.webview.hostObjects.shell.OpenItem(e.Id));

            previewImg.classList.remove("show");
            previewFrame.style.display = "none";
            previewPh.style.display = "none";
            previewDetails.style.display = "flex";
        }

        // F4: show the details card instead of the preview. re-shows the current selection so it takes effect at once.
        function toggleDetails() {
            detailsMode = !detailsMode;
            localStorage.setItem("preview.details", detailsMode ? "1" : "0");
            document.getElementById("details").classList.toggle("active", detailsMode);
            if (current && selIndex >= 0) showPreview(current.Entries[selIndex]);
        }

        // a fresh markdown selection starts a new Back stack at that item.
        function showMarkdown(e) {
            mdStack = [{ id: e.Id, name: e.Name }];
            renderMarkdownTop();
        }

        function markdownBack() {
            if (mdStack.length > 1) { mdStack.pop(); renderMarkdownTop(); }
        }

        // render the top of the Back stack: the host renders the markdown to html and writes it to a temp file, and
        // the frame loads that file:// document so images and relative links resolve, unlike an about:srcdoc frame.
        function renderMarkdownTop() {
            const top = mdStack[mdStack.length - 1];
            const seq = ++mdSeq;
            clearPreview(t("Preview_Loading"));
            chrome.webview.hostObjects.shell.GetMarkdown(top.id).then(async (json) => {
                if (seq !== mdSeq) return;

                const r = JSON.parse(json);
                if (!r.Html) { clearPreview(t("Preview_None")); return; }

                const path = await chrome.webview.hostObjects.shell.WriteMarkdownHtml(markdownDoc(r.Html, r.BaseHref));
                if (seq !== mdSeq) return;
                if (!path) { clearPreview(t("Preview_None")); return; }

                previewImg.classList.remove("show");
                previewFrame.removeAttribute("srcdoc");
                previewIsMarkdown = true;
                previewFrame.src = fileUrl(path) + "?v=" + (++mdVersion);
                previewFrame.style.display = "block";
                previewPh.style.display = "none";
            }).catch((x) => clearPreview(String(x)));
        }

        // wrap the rendered markdown in a small themed page. base makes its relative images and links resolve
        // against the file's own folder, and the host already stripped any raw html, so this needs no sandbox.
        function markdownDoc(bodyHtml, baseHref) {
            const dark = effectiveDark();
            const bg = dark ? "#0e2450" : "#faf6ea", fg = dark ? "#d6e4ff" : "#2a2620";
            const code = dark ? "#071531" : "#efe9d6", line = dark ? "#4f7bd0" : "#b39b6a";
            const base = baseHref ? `<base href="${baseHref}">` : "";
            return `<!doctype html><html><head><meta charset="utf-8">${base}<style>` +
                `body{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6;color:${fg};background:${bg};margin:0;padding:16px 20px}` +
                `pre,code{font-family:"Cascadia Mono",Consolas,monospace}` +
                `code{background:${code};border-radius:4px;padding:1px 5px}` +
                `pre{background:${code};border-radius:6px;padding:10px;overflow:auto}pre code{background:none;padding:0}` +
                `a{color:#66a3ff}img{max-width:100%}` +
                `table{border-collapse:collapse}td,th{border:1px solid ${line};padding:4px 8px}` +
                `h1,h2{border-bottom:1px solid ${line};padding-bottom:.2em}` +
                `blockquote{border-left:3px solid ${line};margin:0;padding-left:12px;opacity:.85}` +
                `</style></head><body>${bodyHtml}</body></html>`;
        }

        function applyFit() {
            previewEl.classList.toggle("fit", fitPreview);
            document.getElementById("fitlabel").textContent = fitPreview ? t("Fit_Fit") : t("Fit_Actual");
        }

        function toggleFit() { fitPreview = !fitPreview; applyFit(); }
        applyFit();

        let current = null;   // the listing on screen
        let selIndex = -1;    // the highlighted row's index in current.Entries
        let selId = null;     // the highlighted item's stable id, the real selection: the index is derived from it,
        // so re-sorting a folder as it streams keeps the highlight on the same item instead of the same row.

        // recompute the selected row's index from its id, after the entries were reordered (a stream page, a sort).
        function resyncSelection() {
            selIndex = selId ? current.Entries.findIndex(e => e.Id === selId) : -1;
        }

        const iconCache = new Map();   // shell images by parsing name, so re-visiting a folder is instant
        let iconMode = false;          // false: thumbnails allowed, true: file type icons only
        // the left pane is either the detail list or a thumbnail gallery, and the gallery's thumbnail size is a
        // slider. both are remembered across sessions, WebView2 keeps localStorage in the app's user data folder.
        let viewMode = localStorage.getItem("view.mode") === "gallery" ? "gallery" : "list";
        let thumbSize = Math.min(256, Math.max(64, parseInt(localStorage.getItem("view.thumb"), 10) || 128));
        let sortCol = "name";          // the column the list is ordered by, click a header to change it
        let sortAsc = true;

        // folders always come first, then the items, each ordered by the chosen column and direction.
        // name and size fall back to name so the order is stable, and the numeric compare keeps file2 before file10.
        function sortEntries(entries) {
            const dir = sortAsc ? 1 : -1;
            const byName = (a, b) => a.Name.localeCompare(b.Name, undefined, { sensitivity: "base", numeric: true });
            entries.sort((a, b) => {
                if (a.IsFolder !== b.IsFolder) return a.IsFolder ? -1 : 1;
                let c;
                if (sortCol === "size") c = (a.Size || 0) - (b.Size || 0);
                else if (sortCol === "mod") c = (a.Modified || "").localeCompare(b.Modified || "");
                else c = byName(a, b);
                if (c === 0 && sortCol !== "name") c = byName(a, b);
                return c * dir;
            });
        }

        function updateSortHeaders() {
            for (const span of document.querySelectorAll(".colhead span")) {
                const label = span.dataset.label || (span.dataset.label = span.textContent);
                span.textContent = label + (span.dataset.col === sortCol ? (sortAsc ? " ▲" : " ▼") : "");
            }
        }

        // the list is virtualized: only the rows in view (plus a small buffer) exist in the DOM, so a folder of any
        // size renders and scrolls in constant time. ROW_H must match the row's fixed CSS height for the math to hold.
        const ROW_H = 22;
        const WINDOW_BUFFER = 8;
        let winFirst = -1, winLast = -1;   // the range currently in the DOM, so an unchanged window skips rebuilding

        function fmtSize(n) {
            if (n < 0) return "";

            const u = ["B", "KB", "MB", "GB", "TB"];
            let i = 0, v = n;
            while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
            return (i === 0 ? v + " " + u[i] : v.toFixed(1) + " " + u[i]);
        }

        function showError(msg) { errEl.style.display = msg ? "block" : "none"; errEl.textContent = msg || ""; }

        // the real shell icon or thumbnail, fetched lazily and async so the view shows at once and images fill in.
        // the emoji stays the fallback until it arrives, or for an item with no parsing name to ask about. size is
        // the pixels asked of the shell, 16 for the list, the slider value for the gallery, and is part of the cache
        // key, so list icons and gallery thumbnails of one item coexist and each size is fetched (and disk cached) once.
        function loadIcon(el, id, stamp, size) {
            if (!id) return;

            size = size || 16;
            const key = id + "|" + (iconMode ? 1 : 0) + "|" + (stamp || "") + "|" + size;
            if (iconCache.has(key)) { applyIcon(el, iconCache.get(key)); return; }

            chrome.webview.hostObjects.shell.GetIcon(id, size, iconMode, stamp || "").then((url) => {
                iconCache.set(key, url || "");
                applyIcon(el, url);
            }).catch(() => { });
        }

        function applyIcon(el, url) {
            if (!url) return;

            const img = document.createElement("img");   // sized by CSS: 16px in the list, fit to the box in the gallery
            img.src = url;
            el.replaceChildren(img);
        }

        // the folder header, kept fresh as rows stream in so the count climbs while a big folder loads.
        function updateCount() {
            const where = current ? (current.Name || t("Nav_Desktop")) : "";
            const n = current ? current.Entries.length : 0;
            const fmt = t(n === 1 ? "Nav_Header_One" : "Nav_Header_Many");
            document.getElementById("navhead").textContent = fmt.replace("{0}", where).replace("{1}", n);
        }

        // the grid geometry for the current view: one full width column of ROW_H rows in the list, or as many
        // thumbnail columns as fit in the gallery. every cell position and the sizer height derive from this.
        function metrics() {
            if (viewMode === "gallery") {
                const w = listEl.clientWidth || 1;
                const cols = Math.max(1, Math.floor(w / (thumbSize + 28)));
                return { cols, cellW: Math.floor(w / cols), cellH: thumbSize + 34 };
            }
            return { cols: 1, cellW: listEl.clientWidth || 1, cellH: ROW_H };
        }

        // size the spacer to the whole folder, so the scrollbar is right even though only the visible cells exist.
        function setSizer() {
            const total = current ? current.Entries.length : 0;
            const m = metrics();
            listSizer.style.height = (Math.ceil(total / m.cols) * m.cellH) + "px";
        }

        function render(listing) {
            current = listing;
            selIndex = -1;
            selId = null;
            followSelection = false;
            showError(listing.Error);
            upBtn.disabled = listing.ParentId === null;

            pathEl.value = listing.Id || "";
            pathEl.title = listing.Id ? listing.Id : t("Path_TipDesktop");
            updateCount();
            showPreview(null);

            sortEntries(listing.Entries);   // apply the chosen column order, so it survives navigation
            updateSortHeaders();

            listEl.scrollTop = 0;
            winFirst = winLast = -1;
            setSizer();
            renderWindow(true);
        }

        // rebuild only the cells that fall in the viewport, plus a small buffer of rows. called on scroll and on data
        // changes. force rebuilds even when the range looks unchanged, for when the cells themselves changed.
        function renderWindow(force) {
            const total = current ? current.Entries.length : 0;
            const m = metrics();
            const viewport = listEl.clientHeight || 1;
            const firstRow = Math.max(0, Math.floor(listEl.scrollTop / m.cellH) - WINDOW_BUFFER);
            const lastRow = Math.ceil((listEl.scrollTop + viewport) / m.cellH) + WINDOW_BUFFER;
            const first = Math.max(0, firstRow * m.cols);
            const last = Math.min(total, lastRow * m.cols);
            if (!force && first === winFirst && last === winLast) return;

            winFirst = first; winLast = last;
            const frag = document.createDocumentFragment();
            for (let i = first; i < last; i++) frag.appendChild(makeCell(current.Entries[i], i, m));
            listSizer.replaceChildren(frag);
        }

        function makeCell(e, i, m) {
            return viewMode === "gallery" ? makeGalleryCell(e, i, m) : makeListRow(e, i);
        }

        // the shared behaviour of a row or cell: click selects, double click opens, right click raises the shell menu.
        function wireCell(el, e, i) {
            el.addEventListener("click", () => selectRow(i));
            el.addEventListener("dblclick", () => activate(i));
            // preventDefault drops the WebView's own page menu, the item is selected first so the menu matches it.
            el.addEventListener("contextmenu", (ev) => {
