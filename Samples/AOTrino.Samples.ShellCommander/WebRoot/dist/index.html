            });
        }

        // one absolutely positioned list row. only visible rows are built, so the icon is fetched right here rather
        // than through an observer, and the caches keep a re-render from redoing the work.
        function makeListRow(e, i) {
            const row = document.createElement("div");
            row.className = "row" + (e.IsFolder ? " dir" : "") + (i === selIndex ? " sel" : "");
            row.style.top = (i * ROW_H) + "px";
            const glyph = e.IsFolder ? "📁" : "📄";
            row.innerHTML =
                `<div class="name-cell"><span class="glyph">${glyph}</span><span class="name"></span></div>` +
                `<div class="size"></div><div class="mod"></div>`;
            row.querySelector(".name").textContent = e.Name;
            row.querySelector(".size").textContent = (e.IsFolder || e.Size < 0) ? "" : fmtSize(e.Size);
            row.querySelector(".mod").textContent = e.Modified || "";
            row.title = e.Id ? `${e.Name}\n${e.Id}` : e.Name;
            if (e.Id) loadIcon(row.querySelector(".glyph"), e.Id, e.Modified || "", 16);
            wireCell(row, e, i);
            return row;
        }

        // one absolutely positioned gallery cell: a thumbnail at the slider's size, the name beneath it.
        function makeGalleryCell(e, i, m) {
            const cell = document.createElement("div");
            cell.className = "cell" + (e.IsFolder ? " dir" : "") + (i === selIndex ? " sel" : "");
            cell.style.left = ((i % m.cols) * m.cellW) + "px";
            cell.style.top = (Math.floor(i / m.cols) * m.cellH) + "px";
            cell.style.width = m.cellW + "px";
            cell.style.height = m.cellH + "px";
            const glyph = e.IsFolder ? "📁" : "📄";
            cell.innerHTML =
                `<div class="thumb" style="width:${thumbSize}px;height:${thumbSize}px">${glyph}</div>` +
                `<div class="cell-name"></div>`;
            cell.querySelector(".cell-name").textContent = e.Name;
            cell.title = e.Id ? `${e.Name}\n${e.Id}` : e.Name;
            if (e.Id) loadIcon(cell.querySelector(".thumb"), e.Id, e.Modified || "", thumbSize);
            wireCell(cell, e, i);
            return cell;
        }

        // rebuild the visible window as the list scrolls, throttled to one rebuild per frame. a scroll the user drove
        // (not one we made to follow the selection) means they took over, so we stop auto following the selection.
        let winRaf = 0;
        let followSelection = false;   // keep the selected row in view as the folder re-sorts while streaming
        let programmaticScrolls = 0;   // scroll events we caused, so they are not read as the user scrolling
        listEl.addEventListener("scroll", () => {
            if (programmaticScrolls > 0) programmaticScrolls--;
            else followSelection = false;
            if (winRaf) return;

            winRaf = requestAnimationFrame(() => { winRaf = 0; renderWindow(false); });
        });

        // scroll the list ourselves, counting the resulting event so the handler above does not read it as the user.
        function scrollTo(v) {
            v = Math.max(0, Math.min(v, listEl.scrollHeight - listEl.clientHeight));
            if (Math.round(v) === Math.round(listEl.scrollTop)) return;   // no change means no scroll event to expect

            programmaticScrolls++;
            listEl.scrollTop = v;
        }

        // nudge the scroll so the cell at index i is in view, block:nearest style, in whichever grid the view uses.
        function ensureVisible(i) {
            const m = metrics();
            const top = Math.floor(i / m.cols) * m.cellH;
            const bottom = top + m.cellH;
            if (top < listEl.scrollTop) scrollTo(top);
            else if (bottom > listEl.scrollTop + listEl.clientHeight) scrollTo(bottom - listEl.clientHeight);
        }

        function selectRow(i) {
            if (!current) return;

            const n = current.Entries.length;
            if (i < 0 || i >= n) return;

            selIndex = i;
            selId = current.Entries[i].Id;
            followSelection = true;   // a fresh pick: keep it in view as the folder keeps streaming
            ensureVisible(i);
            renderWindow(true);   // reflect the new selection, and any scroll ensureVisible caused
            showPreview(current.Entries[i]);
        }

        function moveSel(delta) {
            const n = current ? current.Entries.length : 0;
            if (n === 0) return;

            const i = selIndex < 0 ? (delta > 0 ? 0 : n - 1) : selIndex + delta;
            selectRow(Math.max(0, Math.min(n - 1, i)));
        }

        // Enter or double-click: descend into a folder. files will preview once that is wired up.
        function activate(i) {
            const e = current && current.Entries[i];
            if (e && e.IsFolder) load(e.Id);
        }

        // listing streams: the host binds the folder and returns its header at once, then the rows drain page by page.
        // a sequence guards a fast second navigation (and a quit), only the newest load renders, reports, or keeps going.
        let loadSeq = 0;
        function abortLoad() { loadSeq++; }

        // set by scheduleSelfRefresh before it reloads the current folder, so this load restores the selection and
        // scroll after the rows stream back. captured at once so an ordinary navigation never inherits it.
        let pendingRestore = null;

        async function load(id) {
            const seq = ++loadSeq;
            const restore = pendingRestore;
            pendingRestore = null;
            try {
                const start = JSON.parse(await chrome.webview.hostObjects.shell.ListBegin(id ?? ""));
                if (seq !== loadSeq) return;

                // could not open the target: stay where we are and say so, rather than replacing the view with a
                // dead listing whose Up is disabled. this is what happens deep in a virtual place whose items report
                // as folders but do not reopen by parsing name. the very first load has nowhere to stay, so it renders.
                if (start.Error && current) {
                    showError(start.Error);
                    pathEl.value = current.Id;
                    return;
                }

                const listing = { Name: start.Name, Id: start.Self, ParentId: start.ParentId, Error: start.Error || null, Entries: [] };
                render(listing);   // header and columns at once, the rows fill in below
                syncConsolePath(listing.Id);   // if the console is following along, cd it to the new folder
                chrome.webview.hostObjects.shell.Watch(listing.Id);   // follow shell changes to this folder
                if (start.Error || !start.Token) return;

                // drain page by page. the list is virtualized, so growing the data and re-sorting after each page is
                // cheap and the window rebuild only ever touches the rows in view, so it stays sorted with no reshuffle.
                let done = false;
                while (!done) {
                    const chunk = JSON.parse(await chrome.webview.hostObjects.shell.ListDrain(start.Token));
                    if (seq !== loadSeq) return;   // navigated away or quitting, stop draining (the host cancels the old enumeration)

                    if (chunk.Entries && chunk.Entries.length) {
                        for (const e of chunk.Entries) listing.Entries.push(e);
                        sortEntries(listing.Entries);
                        resyncSelection();   // the sort moved rows, so follow the selected item to its new index
                        updateCount();
                        setSizer();           // grow the spacer first, so the scroll math below sees the new height
                        if (followSelection && selIndex >= 0) ensureVisible(selIndex);
                        renderWindow(true);
                    }
                    if (chunk.Error) showError(chunk.Error);
                    done = chunk.Done;
                    if (!done) await new Promise(r => requestAnimationFrame(r));
                }

                // a self-refresh reload: put the selection, its preview and the scroll back where they were, so a
                // coarse-event environment does not lose the selected item's preview or jump the view to the top.
                if (restore && seq === loadSeq) {
                    const i = restore.selId ? listing.Entries.findIndex(e => e.Id === restore.selId) : -1;
                    if (i >= 0) {
                        selId = restore.selId;
                        selIndex = i;
                        showPreview(current.Entries[i]);   // render cleared it on reload, re-show the kept selection
                    }
                    listEl.scrollTop = restore.scrollTop;
                    renderWindow(true);
                }
            } catch (e) {
                if (seq === loadSeq) showError(String(e));
            }
        }

        function goUp() { if (current && current.ParentId !== null) load(current.ParentId); }

        // a small auto-disappearing toast, top of the stack, gone after a few seconds.
        const toasts = document.getElementById("toasts");
        function showToast(message) {
            const el = document.createElement("div");
            el.className = "toast";
            el.textContent = message;
            toasts.appendChild(el);
            requestAnimationFrame(() => el.classList.add("show"));
            setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3500);
        }

        // the host reports a shell change to the watched folder (from ShellN's ChangeNotifier). the notifier only ever
        // watches the folder on screen, so every change belongs to it: toast it, then apply it granularly (add/remove/
        // update the one row) rather than reloading. a change before the first listing has no rows to touch, so skip it.
        window.__shellChange = function (c) {
            if (!c) return;
            if (c.Message) showToast(c.Message);
            if (!current) return;
            switch (c.Action) {
                case "add": if (c.Entry) shellAddEntry(c.Entry); break;
                case "remove": shellRemoveEntry(c.OldId); break;
                case "update": if (c.Entry) shellUpdateEntry(c.Entry); break;
                case "rename": shellRemoveEntry(c.OldId); if (c.Entry) shellAddEntry(c.Entry); break;
                case "refresh": scheduleSelfRefresh(); break;
            }
        };

        function indexOfEntry(id) { return current ? current.Entries.findIndex(e => e.Id === id) : -1; }

        // relay out just enough after a one-row change: keep it sorted, keep the selection on its item,
        // resize the virtual sizer, and rebuild the visible window. no full reload, no flicker.
        function afterListMutation() {
            sortEntries(current.Entries);
            resyncSelection();
            updateCount();
            setSizer();
            renderWindow(true);
        }

        // a change can name the watched FOLDER ITSELF (its mtime bumps when a child changes). some environments deliver
        // only this coarse "the folder changed" event instead of a granular per-child add/remove/rename (a network
        // share, or a shell handler that does not report item-level notifications). the folder is not a child of its
        // own listing, so it must never become a row: re-enumerate the folder instead, which is the only way to reflect
        // a change we were not told the details of. a null id is an unresolved pidl, left to the granular no-ops below.
        function isSelfFolder(id) { return !!current && id === current.Id; }

        // reload the current folder, debounced so a burst of coarse events collapses to one re-enumeration. selection
        // and scroll are restored after the rows stream back in, so a coarse-event environment still feels granular.
        let selfRefreshTimer = 0;
        function scheduleSelfRefresh() {
            if (selfRefreshTimer) return;
            selfRefreshTimer = setTimeout(() => {
                selfRefreshTimer = 0;
                if (!current) return;
                pendingRestore = { selId, scrollTop: listEl.scrollTop };
                load(current.Id);
            }, 200);
        }

        // find a change-notification entry among the rows already listed. a virtual item (a device under This PC, a file
        // inside a .zip) is announced by a notification under a DIFFERENT namespace root than it was enumerated in, so its
        // notification Id does not match the enumerated one though the display name is identical. names are unique within a
        // folder, so match by Id first, then by name, otherwise the same item is added a second time.
        function findEntryIndex(entry) {
            if (!current || !entry) return -1;
            let i = current.Entries.findIndex(e => e.Id === entry.Id);
            if (i < 0 && entry.Name) i = current.Entries.findIndex(e => e.Name === entry.Name);
            return i;
        }

        function shellAddEntry(entry) {
            if (!entry) return;
            if (isSelfFolder(entry.Id)) { scheduleSelfRefresh(); return; }

            if (findEntryIndex(entry) >= 0) return;   // already listed (possibly under a different virtual-namespace id), no duplicate

            current.Entries.push(entry);
            afterListMutation();
        }

        function shellRemoveEntry(id) {
            if (isSelfFolder(id)) { scheduleSelfRefresh(); return; }

            const i = indexOfEntry(id);
            if (i < 0) return;

            current.Entries.splice(i, 1);
            if (selId === id) { selId = null; showPreview(null); }
            afterListMutation();
        }

        function shellUpdateEntry(entry) {
            if (!entry) return;
            if (isSelfFolder(entry.Id)) { scheduleSelfRefresh(); return; }

            const i = findEntryIndex(entry);
            if (i < 0) { shellAddEntry(entry); return; }

            // keep the enumerated row: a notification entry is low-fidelity (its Size and Modified come back empty). the
            // item changed on disk, so if it is the selected one, re-read its preview, which reflects the new content.
            if (selId === current.Entries[i].Id) showPreview(current.Entries[i]);
        }

        // driven from the keyboard, the way a commander is. handled on the document so it works whatever has focus,
        // which is what "F1 or F2 don't always work" was: the keys were only labels, and list keys needed the list focused.
        document.addEventListener("keydown", (ev) => {
            // keys typed in the console belong to the shell, xterm handles them (and Ctrl+O to toggle), so stay out.
            if (consoleOpen && consolePane.contains(ev.target)) return;

            if (ev.ctrlKey && (ev.key === "o" || ev.key === "O")) { ev.preventDefault(); toggleConsole(); return; }

            // while the path box is focused its own keys win, only the function keys stay global.
            const inInput = ev.target && ev.target.tagName === "INPUT";
            switch (ev.key) {
                case "F1": load(""); break;
                case "F2": load(shell().GetThisPc()); break;
                case "F3": toggleView(); break;
                case "F4": toggleDetails(); break;
                case "F5": if (current) load(current.Id); break;
                case "F6": toggleIconMode(); break;
                case "F7": toggleFit(); break;
                case "F10": abortLoad(); aot() && aot().closeWindow(); break;
                // in the gallery Up and Down move by a whole row of thumbnails, Left and Right by one. the list is one column.
                case "ArrowDown": if (inInput) return; moveSel(viewMode === "gallery" ? metrics().cols : 1); break;
                case "ArrowUp": if (inInput) return; moveSel(viewMode === "gallery" ? -metrics().cols : -1); break;
                case "ArrowRight": if (inInput || viewMode !== "gallery") return; moveSel(1); break;
                case "ArrowLeft": if (inInput || viewMode !== "gallery") return; moveSel(-1); break;
                case "Home": if (inInput) return; selectRow(0); break;
                case "End": if (inInput) return; moveSel(current ? current.Entries.length : 0); break;
                case "Enter": if (inInput) return; if (selIndex >= 0) activate(selIndex); break;
                case "Backspace": if (inInput) return; goUp(); break;
                default: return;
            }
            ev.preventDefault();
        });

        upBtn.addEventListener("click", goUp);
        document.getElementById("reveal").addEventListener("click", () => chrome.webview.hostObjects.shell.RevealInExplorer(current ? current.Id : ""));

        // the path box is editable: type a path or a parsing name and press Enter to go there.
        pathEl.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") { load(pathEl.value.trim()); listEl.focus(); }
            else if (ev.key === "Escape") { pathEl.value = current ? current.Id : ""; pathEl.blur(); }
        });

        document.getElementById("desktop").addEventListener("click", () => load(""));
        document.getElementById("thispc").addEventListener("click", () => load(shell().GetThisPc()));
        document.getElementById("refresh").addEventListener("click", () => { if (current) load(current.Id); });

        // re-layout the current listing out after a view change (mode, thumbnail size, icon mode), keeping the selection and the preview,
        // unlike render which starts a listing fresh. only the visible cells are rebuilt.
        function relayout() {
            if (!current) return;

            winFirst = winLast = -1;
            setSizer();
            if (selIndex >= 0) ensureVisible(selIndex);

            renderWindow(true);
        }

        // reflect the current view in the chrome: the toggle's label (it names what a click switches to), the column header (list only), and the thumbnail slider (gallery only).
        function applyView() {
            document.getElementById("viewlabel").textContent = viewMode === "gallery" ? t("View_List") : t("View_Gallery");
            document.querySelector(".colhead").style.display = viewMode === "gallery" ? "none" : "";
            document.getElementById("thumbctl").style.display = viewMode === "gallery" ? "flex" : "none";
            thumbEl.value = thumbSize;
        }

        function toggleView() {
            viewMode = viewMode === "gallery" ? "list" : "gallery";
            localStorage.setItem("view.mode", viewMode);
            applyView();
            if (selIndex < 0) listEl.scrollTop = 0;   // nothing to keep in view, so start at the top of the new layout

            relayout();
        }

        document.getElementById("view").addEventListener("click", toggleView);

        // the thumbnail size slider, gallery only. discrete steps keep the number of distinct sizes fetched small.
        thumbEl.addEventListener("input", () => {
            thumbSize = parseInt(thumbEl.value, 10);
            localStorage.setItem("view.thumb", thumbSize);
            if (viewMode === "gallery") relayout();
        });

        // switch between real thumbnails and plain file type icons, keeping the selection.
        // the caches are keyed by mode, so both stay warm and switching back is instant.
        function toggleIconMode() {
            iconMode = !iconMode;
            document.getElementById("iconmodelabel").textContent = iconMode ? t("Icon_Icons") : t("Icon_Thumbnails");
            relayout();
        }

        document.getElementById("iconmode").addEventListener("click", toggleIconMode);
        document.getElementById("fit").addEventListener("click", toggleFit);
        document.getElementById("details").addEventListener("click", toggleDetails);
        document.getElementById("details").classList.toggle("active", detailsMode);

        // clicking a column header sorts by it, clicking the same one again reverses the order.
        for (const span of document.querySelectorAll(".colhead span")) {
            span.addEventListener("click", () => {
                const col = span.dataset.col;
                if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
                if (current) render(current);
            });
        }

        // the draggable divider between the two panels, its position kept across sessions in localStorage,
        // which WebView2 persists in the app's user data folder. it is stored as a fraction so it survives a resize.
        (function () {
            const panels = document.getElementById("panels");
            const splitter = document.getElementById("splitter");
            const navPanel = document.getElementById("navPanel");
            let dragging = false, fraction = 0;

            const saved = parseFloat(localStorage.getItem("nav.split"));
            if (saved > 0.1 && saved < 0.9) navPanel.style.flex = "0 0 " + (saved * panels.getBoundingClientRect().width) + "px";

            splitter.addEventListener("mousedown", (e) => {
                dragging = true;
                splitter.classList.add("dragging");
                document.body.style.cursor = "col-resize";
                document.body.style.userSelect = "none";
                e.preventDefault();
            });
            window.addEventListener("mousemove", (e) => {
                if (!dragging) return;

                const rect = panels.getBoundingClientRect();
                const w = Math.max(160, Math.min(rect.width - 220, e.clientX - rect.left - 6));
                navPanel.style.flex = "0 0 " + w + "px";
                fraction = w / rect.width;
            });
            window.addEventListener("mouseup", () => {
                if (!dragging) return;

                dragging = false;
                splitter.classList.remove("dragging");
                document.body.style.cursor = "";
                document.body.style.userSelect = "";
                if (fraction > 0) localStorage.setItem("nav.split", fraction.toFixed(4));
            });
        })();
        document.getElementById("quit").addEventListener("click", () => { abortLoad(); if (aot()) aot().closeWindow(); });

        // window controls: the injected runtime turns these into real Windows commands, and it already maximizes on a double click of the caption strip (data-aotrino-drag).
        document.getElementById("min").addEventListener("click", () => aot() && aot().minimizeWindow());
        document.getElementById("max").addEventListener("click", () => aot() && aot().maximizeWindow());
        document.getElementById("closeWin").addEventListener("click", () => { abortLoad(); if (aot()) aot().closeWindow(); });

        // the maximize button shows restore once the window fills the work area, so it agrees with the window, whether it got there by the button, a double click, or a snap.
        const maxBtn = document.getElementById("max");

        function updateMaxGlyph() {
            const maxed = window.outerWidth >= screen.availWidth - 2 && window.outerHeight >= screen.availHeight - 2;
            maxBtn.innerHTML = maxed ? "&#x2750;" : "&#x25A2;";
            maxBtn.title = maxed ? t("Caption_Restore") : t("Caption_Maximize");
        }

        // a taller window shows more rows, so the virtual window is rebuilt to fill it, and the console is refitted.
        window.addEventListener("resize", () => {
            updateMaxGlyph();
            if (current) renderWindow(true);
            if (consoleOpen && term) {
                const dims = fitTerminal();
                if (dims && dims.cols) chrome.webview.hostObjects.term.Resize(dims.cols, dims.rows);
            }
        });
        updateMaxGlyph();

        // theme: no attribute means follow Windows, the button pins light or dark and flips the glyph.
        const root = document.documentElement;
        const themeBtn = document.getElementById("theme");

        function effectiveDark() {
            return root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        }

        function paintThemeGlyph() { themeBtn.innerHTML = effectiveDark() ? "&#x2600;" : "&#x263E;"; }
        // a markdown preview is coloured to the current theme, so it is re-rendered (at its current Back position) when the theme changes.

        function refreshMarkdownTheme() { if (previewIsMarkdown && mdStack.length) renderMarkdownTop(); }

        themeBtn.addEventListener("click", () => { root.dataset.theme = effectiveDark() ? "light" : "dark"; localStorage.setItem("theme", root.dataset.theme); paintThemeGlyph(); refreshMarkdownTheme(); });
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { paintThemeGlyph(); refreshMarkdownTheme(); });
        paintThemeGlyph();

        // the caption shows the window's own title (AOTrino injects it), so the strip, the taskbar and Alt-Tab agree.
        const winTitle = (window.__aotrino && window.__aotrino.window && window.__aotrino.window.title);
        document.querySelector(".caption .title").textContent = "🪟" + winTitle;
        document.title = winTitle;

        // the console: a ConPTY shell in the browsed folder, drawn by xterm.js.
        // output arrives base64 from the host through window.__termWrite (the window runs it on the page), input and resize go back through the term object.
        const consolePane = document.getElementById("consolePane");
        const consoleSplitter = document.getElementById("consoleSplitter");
        const consoleShell = document.getElementById("consoleShell");
        const consoleSync = document.getElementById("consoleSync");
        let term = null, fitAddon = null, consoleOpen = false, termStarted = false, shellsLoaded = false;
        let shellKey = localStorage.getItem("console.shell") || "";

        const savedConsoleHeight = parseInt(localStorage.getItem("console.height"), 10);
        if (savedConsoleHeight > 80) consolePane.style.height = savedConsoleHeight + "px";

        window.__termWrite = function (b64) {
            if (!term) return;

            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            term.write(bytes);
        };

        window.__termExited = function () {
            if (term) term.write("\r\n\x1b[90m" + t("Console_Exited") + "\x1b[0m\r\n");
            termStarted = false;
        };

        function initTerminal() {
            term = new Terminal({
                cursorBlink: true,
                cursorStyle: "bar",
                fontSize: 13,
                fontFamily: '"Cascadia Mono", "Consolas", "Courier New", monospace',
                theme: { background: "#000000", foreground: "#d6d6d6" }
            });
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById("consoleBody"));
            term.onData(d => chrome.webview.hostObjects.term.Write(d));
            // Ctrl+O toggles the drawer even while the terminal has focus, and is not passed on to the shell.
            term.attachCustomKeyEventHandler((ev) => {
                if (ev.type === "keydown" && ev.ctrlKey && (ev.key === "o" || ev.key === "O")) { toggleConsole(); return false; }
                return true;
            });
        }

        // the installed shells fill the picker once, the remembered one (or the first available) is selected.
        async function loadShells() {
            if (shellsLoaded) return;

            shellsLoaded = true;
            let shells = [];
            try { shells = JSON.parse(await chrome.webview.hostObjects.term.GetShells()); } catch (e) { shells = []; }
            consoleShell.innerHTML = "";
            for (const s of shells) {
                const opt = document.createElement("option");
                opt.value = s.Key;
                opt.textContent = s.Name;
                consoleShell.appendChild(opt);
            }
            if (shells.length && !shells.some(s => s.Key === shellKey)) shellKey = shells[0].Key;
            consoleShell.value = shellKey;
        }

        consoleShell.addEventListener("change", () => {
            shellKey = consoleShell.value;
            localStorage.setItem("console.shell", shellKey);
            restartTerminal();
        });

        // one-way path sync: with this on, navigating a folder sends the shell a cd so the console follows along.
        consoleSync.checked = localStorage.getItem("console.sync") === "1";
        consoleSync.addEventListener("change", () => {
            localStorage.setItem("console.sync", consoleSync.checked ? "1" : "0");
            if (consoleSync.checked && termStarted && current) chrome.webview.hostObjects.term.ChangeDirectory(current.Id);
        });

        // called after each navigation, so the console follows when sync is on.
        function syncConsolePath(id) {
            if (consoleSync.checked && termStarted && id) chrome.webview.hostObjects.term.ChangeDirectory(id);
        }

        function fitTerminal() {
            if (!term || !consoleOpen) return null;
            fitAddon.fit();
            return fitAddon.proposeDimensions();
        }

        async function startTerminal() {
            const dims = fitTerminal() || { cols: 80, rows: 24 };
            const cwd = await chrome.webview.hostObjects.term.Start(current ? current.Id : "", dims.cols, dims.rows, shellKey);
            document.getElementById("consoleCwd").textContent = cwd || "";
            termStarted = true;
            term.focus();
        }

        // switch shells: clear the screen and start the chosen one afresh (Start stops the previous session first).
        function restartTerminal() {
            if (!term || !consoleOpen) return;

            term.reset();
            startTerminal();
        }

        async function openConsole() {
            if (consoleOpen) { if (term) term.focus(); return; }

            consoleOpen = true;
            consolePane.classList.add("open");
            consoleSplitter.classList.add("open");
            if (!term) initTerminal();
            await loadShells();
            if (current) renderWindow(true);   // the list viewport shrank, refill its virtual window
            // let the drawer lay out before measuring it, then fit and, the first time, start the shell.
            requestAnimationFrame(() => {
                if (!termStarted) {
                    startTerminal();
                } else {
                    const dims = fitTerminal();
                    if (dims && dims.cols) chrome.webview.hostObjects.term.Resize(dims.cols, dims.rows);
                }
                term.focus();
            });
        }

        function closeConsole() {
            if (!consoleOpen) return;

            consoleOpen = false;
            consolePane.classList.remove("open");
            consoleSplitter.classList.remove("open");
            if (current) renderWindow(true);
            listEl.focus();
        }

        function toggleConsole() { consoleOpen ? closeConsole() : openConsole(); }

        document.getElementById("console").addEventListener("click", openConsole);
        document.getElementById("consoleClose").addEventListener("click", closeConsole);

        // drag the divider above the console to resize it, its height kept across sessions.
        (function () {
            let dragging = false;
            consoleSplitter.addEventListener("mousedown", (e) => {
                dragging = true;
                consoleSplitter.classList.add("dragging");
                document.body.style.cursor = "row-resize";
                document.body.style.userSelect = "none";
                e.preventDefault();
            });
            window.addEventListener("mousemove", (e) => {
                if (!dragging) return;

                const fnbarTop = document.querySelector(".fnbar").getBoundingClientRect().top;
                const h = Math.max(80, Math.min(window.innerHeight * 0.8, fnbarTop - e.clientY));
                consolePane.style.height = h + "px";
                if (term && consoleOpen) fitAddon.fit();   // resize xterm's own grid live, tell the shell on release
                if (current) renderWindow(true);
            });
            window.addEventListener("mouseup", () => {
                if (!dragging) return;

                dragging = false;
                consoleSplitter.classList.remove("dragging");
                document.body.style.cursor = "";
                document.body.style.userSelect = "";
                localStorage.setItem("console.height", parseInt(consolePane.style.height, 10));
                if (term && consoleOpen) {
                    const dims = fitTerminal();
                    if (dims && dims.cols) chrome.webview.hostObjects.term.Resize(dims.cols, dims.rows);
                }
            });
        })();

        applyView();   // reflect the remembered view (list or gallery) and thumbnail size before the first listing

        if (window.chrome && chrome.webview && chrome.webview.hostObjects) {
            // load the string catalog first so the chrome shows translated, then start at the Desktop.
            loadCatalog().finally(() => load(""));   // start at the Desktop, the top of the shell namespace
        } else {
            showError("chrome.webview.hostObjects not available");
        }
    </script>
</body>
</html>
