# Cuts a release: every sample, AOT-compiled for x86 / x64 / arm64, one zip per architecture, attached to a
# GitHub release with generated notes.
#
# The three architectures build on three runners at once (the `build` matrix), because the slow part is Native
# AOT - a dozen binaries compiled and linked, three times over - and no cache touches that. One runner did them
# back to back; three do them side by side, so the wall-clock is one architecture's build plus a small release
# step, instead of the sum of all three. Concurrent jobs are free on a public repo.
#
# Each leg still runs publish.bat - the same script as by hand - so the released binaries come out of the same
# path a local drop does. The leg produces a zip; the final `release` job collects the three and publishes them.
#
# Nothing here runs on its own. Start it with release.bat, from the Actions tab, or with the GitHub CLI:
#
#     gh workflow run release.yml -f release=true      builds and publishes the release.
#     gh workflow run release.yml                      builds and leaves the zips as artifacts.
#
# The tag is v<Version> from Directory.Build.props, created by the release itself, so bumping that decides the number.
# The AOTrino and AOTrino.Templates packages are packed from the same commit and pushed to nuget.org with that version,
# which needs the NUGET_API_KEY repository secret. Without release=true they stay as artifacts, ready to test the templates with.
# A version that has already been released or pushed stops the run before anything is published.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build. Leave empty for the default branch.'
        required: false
        default: ''
      release:
        description: 'Publish a GitHub release, tagged from the Version in Directory.Build.props'
        type: boolean
        required: false
        default: false

permissions:
  # gh release create writes to the repo. The default token is read-only.
  contents: write

jobs:
  build:
    name: publish ${{ matrix.rid }}
    runs-on: windows-latest

    strategy:
      # see every architecture's failures in one run rather than having the first cancel the rest - a release
      # wants all three or none, and the release job below won't run unless every leg succeeded anyway
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            upx: true
          - rid: win-x64
            upx: true
          # arm64 gets no UPX: it can't pack win64/arm64 yet ("CantPackException"), so running it is a
          # guaranteed warning and nothing else. When UPX learns arm64, flip this to true.
          - rid: win-arm64
            upx: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # caches ~/.npm keyed on the root package-lock.json - the React/Fluent samples npm install + build
          cache: 'npm'

      # The NuGet global-packages folder, shared by all three legs (every leg restores all three RIDs, so they
      # want the same packages). The point of caching it is the ILCompiler runtime packs - ~100-200 MB each,
      # re-downloaded on every cold run. The legs race to populate it on a first run; whoever saves first wins
      # and the others log "already exists", which is not a failure.
      - name: cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      # x86/x64 only - see the matrix note on arm64. UPX is optional to the drop (publish.bat treats a failure
      # as a warning), but without it the exes are 11 MB instead of 4.
      - name: install upx
        if: matrix.upx
        run: choco install upx --no-progress -y

      - name: publish + zip ${{ matrix.rid }}
        shell: pwsh
        run: |
          # splat the args so the -upx toggle is present or absent, never an empty token - publish.bat's arg
          # parser reads a "" as end-of-args and would quietly stop
          $publishArgs = @('-clean', '-rid', '${{ matrix.rid }}', '-zip')
          if ('${{ matrix.upx }}' -eq 'true') { $publishArgs = @('-upx') + $publishArgs }
          & .\publish.bat @publishArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: zip-${{ matrix.rid }}
          path: publish/AOTrino-samples-${{ matrix.rid }}.zip
          if-no-files-found: error

  packages:
    name: pack the NuGet packages
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # the templates package carries the npm libraries as tarballs, which its pack builds with npm.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: dotnet pack
        shell: pwsh
        run: |
          dotnet pack AOTrino/AOTrino.csproj -c Release -o nupkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack Templates/AOTrino.Templates.csproj -c Release -o nupkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  release:
    name: publish the release
    needs: [ build, packages ]
    if: inputs.release
    # just gh + an upload; a Linux runner starts faster and there's nothing Windows-specific left to do
    runs-on: ubuntu-latest

    steps:
      # only for Directory.Build.props, which is where the version comes from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: read the version
        id: version
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ -z "$version" ]; then echo "no <Version> found in Directory.Build.props"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          # the commit that was actually checked out, which is not the one that started the run when a ref was given.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "releasing $version from $(git rev-parse --short HEAD)"

      - name: collect the zips
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: zip-*
          # flatten the three zip-win-* artifacts into dist\ instead of a folder each
          merge-multiple: true

      - name: collect the packages
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      # every check runs before anything is published, so a refusal leaves nothing half released.
      - name: check nothing is published yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist nupkg

          if [ -z "$NUGET_API_KEY" ]; then
            echo "the NUGET_API_KEY repository secret is not set, see docs/MAINTENANCE.md."
            exit 1
          fi

          # refusing rather than replacing, so a forgotten version bump cannot overwrite what is already published.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "$TAG is already released. Bump <Version> in Directory.Build.props and run this again."
            exit 1
          fi

          # a tag that already exists is reused as it is, whatever --target says,
          # so releasing would attach zips built here to a commit somewhere else entirely.
          existing=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -z "$existing" ]; then existing=$(git ls-remote origin "refs/tags/$TAG" | cut -f1); fi
          if [ -n "$existing" ] && [ "$existing" != "$SHA" ]; then
            echo "$TAG already exists and points at $existing, not at the commit built here, $SHA."
            echo "Delete the tag, git push origin :refs/tags/$TAG, then run this again."
            exit 1
          fi

          # a version pushed to nuget.org can never be replaced, only followed by another one.
          for id in AOTrino AOTrino.Templates; do
            if [ ! -f "nupkg/$id.$VERSION.nupkg" ]; then echo "nupkg/$id.$VERSION.nupkg was not packed"; exit 1; fi
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            if curl -sf "https://api.nuget.org/v3-flatcontainer/$lower/index.json" | grep -q "\"$VERSION\""; then
              echo "$id $VERSION is already on nuget.org. Bump <Version> in Directory.Build.props and run this again."
              exit 1
            fi
          done

      # AOTrino first, since an app generated by the templates references it.
      - name: push the packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for id in AOTrino AOTrino.Templates; do
            dotnet nuget push "nupkg/$id.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done

      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          # --generate-notes writes what changed since the last tag, on the server.
          gh release create "$TAG" dist/*.zip --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes

      - name: what shipped
        run: |
          for f in dist/*.zip nupkg/*.nupkg; do printf '%-40s %6.1f MB\n' "$(basename "$f")" "$(echo "scale=1; $(stat -c%s "$f")/1048576" | bc)"; done
